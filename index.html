
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abisinin Gülü 🤍🌹</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  width: 100%;
  height: 100vh;
  overflow: hidden;
  background: #050b08;
  color: white;
  font-family: Georgia, serif;
}

.scene {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  background:
    radial-gradient(ellipse at 50% 48%,
      #243b2d 0%,
      #101d15 42%,
      #050a07 85%);
}

/* ATMOSFER */

.ambient {
  position: absolute;
  width: 80vw;
  height: 80vw;
  border-radius: 50%;
  background: radial-gradient(circle,
    rgba(210,240,213,.12),
    transparent 70%);
  filter: blur(25px);
  opacity: .5;
  animation: ambient 5s infinite alternate;
}

@keyframes ambient {
  to { transform: scale(1.2); opacity: .9; }
}

.stars {
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(1px 1px at 15% 20%,#fff 90%,transparent),
    radial-gradient(2px 2px at 80% 30%,#fff 90%,transparent),
    radial-gradient(1px 1px at 65% 70%,#fff 90%,transparent),
    radial-gradient(2px 2px at 25% 65%,#fff 90%,transparent),
    radial-gradient(1px 1px at 90% 80%,#fff 90%,transparent);
  opacity: .5;
  animation: twinkle 4s infinite alternate;
}

@keyframes twinkle {
  to { opacity: .9; }
}

/* SAHNE */

.garden {
  position: absolute;
  width: min(100vw, 850px);
  height: min(100vh, 950px);
  bottom: 0;
}

svg {
  width: 100%;
  height: 100%;
  overflow: visible;
}

/* TOPRAK */

.soil-top {
  fill: url(#soilGrad);
}

.soil-layer {
  fill: #211a14;
}

.soil-detail {
  fill: #85705a;
  opacity: .5;
}

.ground-line {
  stroke: #9b8867;
  stroke-width: 3;
  opacity: .5;
}

/* TOHUM */

.seed {
  transform-box: fill-box;
  transform-origin: center;
  opacity: 1;
}

.seed-shell {
  fill: url(#seedGrad);
  stroke: #a88b55;
  stroke-width: 2;
}

.seed-crack {
  stroke: #dbc18c;
  stroke-width: 2;
  fill: none;
  stroke-linecap: round;
}

/* KÖKLER */

.roots {
  fill: none;
  stroke: #a5a16b;
  stroke-width: 4;
  stroke-linecap: round;
  stroke-dasharray: 300;
  stroke-dashoffset: 300;
}

/* GÖVDE */

.stem {
  fill: none;
  stroke: url(#stemGrad);
  stroke-width: 13;
  stroke-linecap: round;
  stroke-dasharray: 650;
  stroke-dashoffset: 650;
}

.stem-highlight {
  fill: none;
  stroke: #a4c87e;
  stroke-width: 2;
  opacity: .5;
}

/* YAPRAKLAR */

.leaf {
  opacity: 0;
  transform-box: fill-box;
  transform-origin: 50% 100%;
}

.leaf-main {
  fill: url(#leafGrad);
  stroke: #8fb57b;
  stroke-width: 2;
}

.leaf-vein {
  stroke: #b5d49a;
  stroke-width: 2;
  fill: none;
  opacity: .8;
}

/* DİKENLER */

.thorn {
  fill: #658b53;
  opacity: 0;
}

/* GÜL */

.flower {
  transform-box: fill-box;
  transform-origin: center;
}

.bud {
  opacity: 0;
}

.outer-petal {
  fill: url(#outerPetal);
  stroke: #d5d4cd;
  stroke-width: 1.5;
}

.middle-petal {
  fill: url(#middlePetal);
  stroke: #deddd7;
  stroke-width: 1.2;
}

.inner-petal {
  fill: url(#innerPetal);
  stroke: #eeeae0;
  stroke-width: 1;
}

.rose-center {
  fill: none;
  stroke: #e8d9b4;
  stroke-width: 5;
  stroke-linecap: round;
}

/* PARILTILAR */

.spark {
  fill: #fff9dc;
  opacity: 0;
  filter: url(#glow);
}

/* BAŞLANGIÇ BUTONU */

.start-screen {
  position: absolute;
  inset: 0;
  z-index: 10;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  gap: 22px;
  background: rgba(0,0,0,.1);
  transition: opacity 1.2s;
}

.start-screen h1 {
  font-size: clamp(27px,5vw,45px);
  font-weight: normal;
  letter-spacing: 2px;
  color: #f7f5ed;
  text-shadow: 0 0 30px #fff8;
}

.start-screen button {
  background: rgba(35,65,43,.8);
  border: 1px solid #dcebd2;
  color: white;
  padding: 16px 38px;
  border-radius: 50px;
  font-family: Georgia,serif;
  font-size: 18px;
  cursor: pointer;
  transition: .3s;
  box-shadow: 0 0 30px #d6f4d522;
}

.start-screen button:hover {
  transform: scale(1.07);
  background: #466b4a;
  box-shadow: 0 0 40px #d6f4d555;
}

/* MESAJ */

.message {
  position: absolute;
  z-index: 5;
  bottom: 7%;
  width: 92%;
  text-align: center;
  opacity: 0;
  transform: translateY(25px);
  transition: 2s ease;
  text-shadow: 0 2px 15px #000, 0 0 30px #fff4;
}

.message p {
  font-size: clamp(18px,3vw,29px);
  line-height: 1.65;
}

.message span {
  display: block;
  margin-top: 10px;
  font-size: 28px;
}

/* MÜZİK */

.music {
  position: absolute;
  right: 12px;
  bottom: 12px;
  width: 220px;
  opacity: 0;
  transition: 1.5s;
  z-index: 20;
}

.music audio {
  width: 100%;
}

/* ANİMASYON SIRASI */

body.started .start-screen {
  opacity: 0;
  pointer-events: none;
}

/* Kökler çıkar */

body.started .roots {
  animation: rootsGrow 2.5s .2s ease-out forwards;
}

@keyframes rootsGrow {
  to { stroke-dashoffset: 0; }
}

/* Tohum çatlar */

body.started .seed {
  animation: seedCrack 1.3s .4s forwards;
}

@keyframes seedCrack {
  0% { transform: scale(1); }
  60% { transform: scale(1.25); }
  100% { opacity: 0; transform: scale(.3); }
}

/* Filiz */

body.started .stem {
  animation: stemGrow 4.8s 1.1s ease-in-out forwards;
}

@keyframes stemGrow {
  to { stroke-dashoffset: 0; }
}

/* Yapraklar */

body.started .leaf {
  animation: leafGrow 1.8s 3.4s ease-out forwards;
}

@keyframes leafGrow {
  0% {
    opacity: 0;
    transform: scale(.05) rotate(-35deg);
  }
  100% {
    opacity: 1;
    transform: scale(1) rotate(0);
  }
}

body.started .thorn {
  animation: appear .8s 3.5s forwards;
}

@keyframes appear {
  to { opacity: 1; }
}

/* Gonca */

body.started .bud {
  animation: budGrow 2s 4.4s ease-out forwards;
}

@keyframes budGrow {
  from {
    opacity: 0;
    transform: scale(.1);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

/* Çiçek açma */

body.bloom .outer-petal {
  animation: petalOuter 2s ease-out forwards;
}

body.bloom .middle-petal {
  animation: petalMiddle 2s .25s ease-out forwards;
}

body.bloom .inner-petal {
  animation: petalInner 1.8s .5s ease-out forwards;
}

body.bloom .rose-center {
  animation: centerAppear 1.5s .7s forwards;
}

@keyframes petalOuter {
  0% {
    transform: scale(.15) rotate(-20deg);
    opacity: .2;
  }
  100% {
    transform: scale(1) rotate(0);
    opacity: 1;
  }
}

@keyframes petalMiddle {
  0% {
    transform: scale(.2) rotate(15deg);
    opacity: 0;
  }
  100% {
    transform: scale(1) rotate(0);
    opacity: 1;
  }
}

@keyframes petalInner {
  0% {
    transform: scale(.1);
    opacity: 0;
  }
  100% {
    transform: scale(1);
    opacity: 1;
  }
}

@keyframes centerAppear {
  to { opacity: 1; }
}

/* SON SAHNE */

body.final .garden {
  animation: shrinkGarden 2.2s ease forwards;
}

@keyframes shrinkGarden {
  to {
    transform: scale(.67) translateY(-8%);
  }
}

body.final .message {
  opacity: 1;
  transform: translateY(0);
}

body.final .music {
  opacity: 1;
}

@media(max-width:600px) {
  .garden {
    width: 115vw;
    height: 83vh;
  }

  .message p {
    font-size: 18px;
  }

  .music {
    width: 155px;
  }
}

@media(prefers-reduced-motion: reduce) {
  .stars, .ambient { animation: none; }
}
</style>
</head>

<!-- BAŞLANGIÇ -->

<!-- MESAJ -->

    sen benim birtanemsin canımsın kuzenimm.<br>
    iyiki varsın iyi teyzem doğurmuş seni :D<br>
    abisinin gülüüüü 🤍🌹
  </p>
  <span>🤍🌹</span>
</div>

<!-- MÜZİK -->

<div class="music">
  <audio id="music" controls loop>
    <source src="muzik.mp3" type="audio/mpeg">
  </audio>
</div>

</div>

<script>

const startBtn = document.getElementById("startBtn");
const music = document.getElementById("music");

let started = false;

startBtn.addEventListener("click", () => {

  if (started) return;
  started = true;

  document.body.classList.add("started");

  music.volume = 0.75;

  music.play().catch(() => {
    console.log("Müziği başlatmak için oynat tuşuna bas.");
  });

  // Gülün büyümesi
  setTimeout(() => {
    document.body.classList.add("bloom");
  }, 4700);

  // Son sahne
  setTimeout(() => {
    document.body.classList.add("final");
  }, 8000);

});

</script>
