<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flowers 🌸</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#080b10;
  color:white;
  font-family:Georgia,serif;
  overflow:hidden;
}
canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
}
.overlay{
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-end;
  padding:35px 20px;
  pointer-events:none;
  text-align:center;
}
h1{
  font-size:clamp(25px,7vw,38px);
  font-weight:normal;
  letter-spacing:5px;
  color:#e8d7c4;
  text-shadow:0 0 20px #e9b6ce55;
}
p{
  margin-top:12px;
  color:#8d929c;
  font-size:13px;
  letter-spacing:2px;
}
button{
  pointer-events:auto;
  margin-top:25px;
  background:transparent;
  color:#e8c8d6;
  border:1px solid #8f647b;
  padding:12px 25px;
  border-radius:30px;
  letter-spacing:2px;
  cursor:pointer;
}
</style>
</head>
<body>

<canvas id="flower"></canvas>

<div class="overlay">
  <h1>Flowers</h1>
  <p>EVERYTHING BEAUTIFUL TAKES TIME</p>
  <button onclick="restart()">BLOOM AGAIN ✦</button>
</div>

<script>
const canvas=document.getElementById("flower");
const ctx=canvas.getContext("2d");

let W,H,cx,ground;
let start=performance.now();
let particles=[];
let falling=[];
let paused=false;
let last=0;

function resize(){
  const dpr=Math.min(devicePixelRatio||1,2);
  W=innerWidth; H=innerHeight;
  canvas.width=W*dpr;
  canvas.height=H*dpr;
  canvas.style.width=W+"px";
  canvas.style.height=H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  cx=W/2;
  ground=H*.76;
  createParticles();
}
addEventListener("resize",resize);

function rand(a,b){return a+Math.random()*(b-a)}

function createParticles(){
  particles=[];
  for(let i=0;i<6500;i++){
    let angle=rand(0,Math.PI*2);
    let radius=Math.sqrt(Math.random());
    particles.push({
      angle,radius,
      size:rand(.5,1.8),
      seed:rand(0,10),
      hue:rand(0,1)
    });
  }
}

function restart(){
  start=performance.now();
  falling=[];
}

function ease(t){
  t=Math.max(0,Math.min(1,t));
  return t*t*(3-2*t);
}

function dot(x,y,r,color,alpha=1){
  ctx.globalAlpha=alpha;
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fill();
}

function draw(now){
  if(paused)return;
  const t=((now-start)/1000)%22;

  ctx.clearRect(0,0,W,H);

  // Ambient glow
  let glow=ctx.createRadialGradient(cx,ground-180,5,cx,ground-180,Math.max(W,H)*.65);
  glow.addColorStop(0,"#33202b55");
  glow.addColorStop(1,"#080b1000");
  ctx.fillStyle=glow;
  ctx.fillRect(0,0,W,H);

  // Soil
  for(let i=0;i<260;i++){
    let x=rand(0,W);
    let y=ground+rand(0,45);
    dot(x,y,rand(.5,1.5),"#9d8066",.22);
  }

  // Life phases
  let growth=ease(t/6);
  let bloom=ease((t-5)/4);
  let decay=ease((t-14)/4);
  let alive=bloom*(1-decay);

  // Stem
  let stemHeight=Math.min(H*.34,250)*growth;
  ctx.beginPath();
  ctx.moveTo(cx,ground);
  ctx.quadraticCurveTo(cx-35,ground-stemHeight*.5,cx,ground-stemHeight);
  ctx.strokeStyle="#789b75";
  ctx.lineWidth=3;
  ctx.globalAlpha=growth;
  ctx.stroke();

  // Stem particles
  for(let i=0;i<180;i++){
    let u=Math.random();
    let x=cx-35*Math.sin(u*Math.PI/2)*u+rand(-3,3);
    let y=ground-stemHeight*u;
    dot(x,y,rand(.6,1.5),"#a3c78b",growth*.65);
  }

  // Leaves
  for(let side of [-1,1]){
    let x=cx+side*35;
    let y=ground-stemHeight*.55;
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(side*.5);
    ctx.globalAlpha=growth;
    ctx.beginPath();
    ctx.ellipse(0,0,27,10,0,0,Math.PI*2);
    ctx.fillStyle="#355f49";
    ctx.fill();
    for(let i=0;i<45;i++){
      dot(rand(-23,23),rand(-7,7),rand(.5,1.3),"#a6c88a",.65);
    }
    ctx.restore();
  }

  // Flower position
  let fx=cx;
  let fy=ground-stemHeight;

  // Petals
  const count=11;
  for(let i=0;i<count;i++){
    let a=i*Math.PI*2/count;
    let open=bloom*(1-decay*.8);
    let r=42*open;
    let px=fx+Math.cos(a)*r;
    let py=fy+Math.sin(a)*r;

    ctx.save();
    ctx.translate(fx,fy);
    ctx.rotate(a);
    ctx.globalAlpha=alive;
    ctx.beginPath();
    ctx.ellipse(0,-r*.65,13*open,25*open,0,0,Math.PI*2);
    let g=ctx.createLinearGradient(0,-r,0,0);
    g.addColorStop(0,"#f7d9e8");
    g.addColorStop(1,"#bc668d");
    ctx.fillStyle=g;
    ctx.fill();
    ctx.restore();

    // Pointillist petals
    for(let j=0;j<100;j++){
      let rr=Math.sqrt(Math.random())*r;
      let ang=rand(0,Math.PI*2);
      dot(
        fx+Math.cos(ang)*rr,
        fy+Math.sin(ang)*rr,
        rand(.5,1.4),
        Math.random()>.5?"#f7d6e6":"#d58baa",
        alive*.65
      );
    }
  }

  // Flower center
  for(let i=0;i<180;i++){
    let a=rand(0,Math.PI*2);
    let r=Math.sqrt(Math.random())*13*bloom;
    dot(fx+Math.cos(a)*r,fy+Math.sin(a)*r,
      rand(.7,1.7),"#f6d88c",alive);
  }

  // Floating and falling particles
  if(t>13 && Math.random()<.4){
    falling.push({
      x:fx+rand(-35,35),
      y:fy+rand(-20,20),
      vx:rand(-.8,.8),
      vy:rand(.3,1.3),
      life:1
    });
  }

  falling=falling.filter(p=>p.life>0);
  for(let p of falling){
    p.x+=p.vx;
    p.y+=p.vy;
    p.life-=.008;
    dot(p.x,p.y,2,"#e6a8c4",p.life);
  }

  // Atmospheric stars
  for(let i=0;i<55;i++){
    let x=(i*137.5)%W;
    let y=(i*83.7)%H*.8;
    let a=.2+.3*Math.sin(now/1000+i);
    dot(x,y,1,"#e5d4e9",a);
  }

  ctx.globalAlpha=1;
  requestAnimationFrame(draw);
}

resize();
requestAnimationFrame(draw);
</script>
</body>
</html>
